# Which process re-reads a domain after it changes.
#
# `logout` means the domain has no single owning process and its keys are read
# at login. `none` means the value is consulted per use, so nothing needs
# restarting. Every domain named in a record must appear here or in the settings
# directory's own restart.conf, which takes precedence; `lint` enforces that.
# Without it a new record would be applied and then silently not take effect.

com.apple.dock	Dock
com.apple.finder	Finder
com.apple.WindowManager	WindowManager
com.apple.controlcenter	ControlCenter
com.apple.menuextra.clock	ControlCenter
com.apple.systemuiserver	SystemUIServer
com.apple.Safari	Safari
com.apple.TextEdit	TextEdit
com.apple.ActivityMonitor	ActivityMonitor

# Consulted per use rather than held by a running process.
com.apple.screencapture	none
com.apple.desktopservices	none
com.apple.LaunchServices	none
com.apple.Spotlight	none

# Read at login, so there is no process to restart.
NSGlobalDomain	logout
com.apple.Accessibility	logout
com.apple.universalaccess	logout
com.apple.HIToolbox	logout
com.apple.symbolichotkeys	logout
com.apple.AppleMultitouchTrackpad	logout
com.apple.driver.AppleBluetoothMultitouch.trackpad	logout
com.apple.AppleMultitouchMouse	logout
com.apple.driver.AppleBluetoothMultitouch.mouse	logout
