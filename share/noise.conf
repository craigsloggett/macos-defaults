# Keys that macOS rewrites on its own schedule. They are stripped before two
# snapshots are compared, otherwise the domains that own them appear changed in
# every diff and get subtracted away as noise along with the signal.
#
# One key name per line. Only scalar keys belong here, since a key is removed
# together with the single line that follows it.

mod-count
last-analytics-stamp
lastShowIndicatorTime
LastUse
LastSet
timestamp
