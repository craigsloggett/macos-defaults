# System Settings > Desktop & Dock
#
# Records are tab separated: domain, key, type, value.
# Types are the `defaults write` flags: bool, int, float, string.
#
# Name each file after the System Settings pane it came from. Discovery is pane
# driven, so the file you edit should be the pane you were looking at. One pane
# touching several domains is fine, because the domain is a column.

# Hide the Dock so the full screen height is usable.
com.apple.dock	autohide	bool	true
com.apple.dock	autohide-delay	float	0
com.apple.dock	tilesize	int	45

# Recents adds apps to the Dock without being asked, which defeats a curated Dock.
com.apple.dock	show-recents	bool	false

# Hot corners need both the corner and its modifier, or the corner does nothing.
# 1 disables a corner; 14 opens Quick Note.
com.apple.dock	wvous-br-corner	int	14
com.apple.dock	wvous-br-modifier	int	0

# Stage Manager off. Note this one is an int, not a bool, even though it reads
# as 1. Always confirm with `defaults read-type` before recording.
com.apple.WindowManager	AutoHide	bool	false
com.apple.WindowManager	AppWindowGroupingBehavior	int	1
